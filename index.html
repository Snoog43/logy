<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; background: #171922; color: #eef0f8; font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  form { width: 100%; max-width: 360px; background: #212432; border-radius: 24px; padding: 28px 24px; box-shadow: 0 30px 70px -30px rgba(0,0,0,.8); display: grid; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 22px; margin-bottom: 4px; }
  label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #9399b2; }
  input[type=password] { width: 100%; font: inherit; color: #eef0f8; background: #282c3c; border: 1px solid transparent; border-radius: 12px; padding: 12px 14px; }
  input[type=password]:focus { outline: none; border-color: #8b6cf6; }
  .remember { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 500; letter-spacing: 0; text-transform: none; color: #9399b2; }
  button { font: 700 15px inherit; font-family: inherit; color: #fff; background: #8b6cf6; border: 0; border-radius: 12px; padding: 12px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  button:focus-visible, input:focus-visible { outline: 2px solid #a58cff; outline-offset: 2px; }
  .err { color: #f0566a; font-size: 14px; min-height: 1.4em; margin: 0; }
</style>

const un64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_STORE = "logy-key-" + SALT.slice(0, 8);
async function unlock(keyRaw) {
  const key = await crypto.subtle.importKey("raw", keyRaw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: un64(IV) }, key, un64(DATA));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }
async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: un64(SALT), iterations: ITER, hash: "SHA-256" }, base, 256));
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_STORE); } catch (e) {}
  if (saved) { try { show(await unlock(un64(saved))); return; } catch (e) { try { localStorage.removeItem(KEY_STORE); } catch (e2) {} } }
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Ouverture…"; err.textContent = "";
  try {
    const raw = await derive(document.getElementById("pw").value);
    const html = await unlock(raw);
    if (document.getElementById("rem").checked) {
      try { localStorage.setItem(KEY_STORE, btoa(String.fromCharCode(...raw))); } catch (e2) {}
    }
    show(html);
  } catch (x) {
    btn.disabled = false; btn.textContent = "Entrer";
    err.textContent = "Mot de passe incorrect.";
  }
});
</script>
